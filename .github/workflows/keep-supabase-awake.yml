name: Keep Supabase awake

# 무료 플랜 프로젝트는 7일간 요청이 없으면 자동 정지되고,
# 정지되면 대시보드에서 손으로 깨워야 한다. 매일 한 번 툭 건드려서
# 그 일이 생기지 않게 한다.
#
# 설정값은 저장소의 .env.production에서 읽는다(공개용 값이라 커밋해 둠).
# 저장소 시크릿 SUPABASE_URL / SUPABASE_ANON_KEY 가 있으면 그쪽을 우선한다.
on:
  schedule:
    - cron: '17 3 * * *' # 매일 UTC 03:17 (한국시간 12:17)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 깨우기
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 시크릿이 없으면 저장소의 .env.production에서 읽는다
          if [ -z "$URL" ] && [ -f .env.production ]; then
            URL=$(grep -m1 '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          fi
          if [ -z "$KEY" ] && [ -f .env.production ]; then
            KEY=$(grep -m1 '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          fi
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Supabase 설정을 찾지 못해 건너뜁니다."
            exit 0
          fi

          # 데이터베이스에 실제로 닿는 요청이어야 정지 타이머가 초기화된다.
          # RLS로 막혀 있어 내용은 안 보이지만(0건 반환) DB에는 도달한다.
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/households?select=id&limit=1")

          echo "응답 코드: $code"
          head -c 300 /tmp/out; echo

          # 2xx(정상) 또는 401/403(RLS로 차단 — DB에는 닿음) 이면 성공으로 본다
          case "$code" in
            2*|401|403) echo "깨어 있음" ;;
            *) echo "::error::Supabase가 응답하지 않습니다 (코드 $code)"; exit 1 ;;
          esac

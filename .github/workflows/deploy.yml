name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 사이트가 덮여 있으면 배포를 한 번 더 돌린다 (맨 아래)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.stamp.outputs.js }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 빌드에 필요한 파일이 git에 실제로 올라와 있는지 먼저 확인한다.
      # (.gitignore가 스크립트를 삼켜 배포가 실패한 적이 있다)
      - run: git ls-files --error-unmatch scripts/check-precache.mjs
      - run: git ls-files --error-unmatch scripts/check-contrast.mjs
      - run: npm ci
      - run: npm run build
      # 빌드가 참조하는 파일이 전부 프리캐시에 들어갔는지 확인한다.
      # 하나라도 빠지면 다음 배포 때 그 파일이 404가 되어 이미지가 깨지므로,
      # 사용자가 겪기 전에 여기서 배포를 멈춘다.
      # 동기화 병합 규칙(지운 게 되살아나지 않는지 등) 검증
      - run: npm test
      - run: npm run check:precache
      # 글자가 배경에 묻히는 곳이 없는지 실제로 그려서 재본다.
      # 다크 모드에서 검은 글씨가 검은 카드 위에 올라간 적이 있는데,
      # 눈으로 훑어서는 이런 걸 놓친다.
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run check:contrast
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # 이번 빌드의 대표 파일 이름(해시 포함). 배포 뒤 실제 사이트가 이걸
      # 내주는지 확인하는 데 쓴다.
      - id: stamp
        run: echo "js=$(grep -o 'assets/index-[^\"]*\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 설정이 '브랜치에서 배포'라 push 마다 GitHub 기본 배포(Jekyll,
      # 빌드 안 된 원본)도 같이 돈다. 나중에 끝난 쪽이 사이트를 덮어쓰는데,
      # 2026-10-21 05:52 에 둘이 같은 초에 끝나 원본이 이겨 폰이 옛 버전에
      # 멈췄다. 기본 배포는 push 뒤 1분 30초 안에 끝나므로, 우리 배포를
      # 조금 늦춰 늘 마지막에 덮어쓰게 한다.
      # (Settings → Pages → Source 를 'GitHub Actions' 로 바꾸면 필요 없다)
      - if: github.event_name == 'push'
        run: sleep 75
      - id: deployment
        uses: actions/deploy-pages@v4
      # 재발 방지: '배포 성공' 표시만 믿지 않고 실제 사이트를 열어 본다.
      # 3분 동안 이번 빌드가 안 보이면(기본 배포가 덮었으면) 배포를 한 번 더
      # 돌린다. 손으로 돌린 배포에는 기본 배포가 따라오지 않아 그 판이 이긴다.
      # 다시 돌린 판에서도 안 보이면 더 돌리지 않고 실패로 남긴다(무한 반복 방지).
      - name: 실제 사이트 확인
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          JS: ${{ needs.build.outputs.js }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 18); do
            # 캐시를 피하려고 매번 다른 주소로 연다
            if curl -fsSL "${URL}?check=$(date +%s%N)" | grep -q "$JS"; then
              echo "확인: 사이트가 이번 빌드($JS)를 내준다"; exit 0
            fi
            sleep 10
          done
          echo "::warning::사이트가 이번 빌드($JS)를 내주지 않는다 — 기본 배포가 덮은 것 같다"
          if [ "${{ github.event_name }}" = "push" ]; then
            gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
            echo "배포를 한 번 더 돌렸다"
          else
            exit 1
          fi

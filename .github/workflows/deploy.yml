name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 빌드에 필요한 파일이 git에 실제로 올라와 있는지 먼저 확인한다.
      # (.gitignore가 스크립트를 삼켜 배포가 실패한 적이 있다)
      - run: git ls-files --error-unmatch scripts/check-precache.mjs
      - run: npm ci
      - run: npm run build
      # 빌드가 참조하는 파일이 전부 프리캐시에 들어갔는지 확인한다.
      # 하나라도 빠지면 다음 배포 때 그 파일이 404가 되어 이미지가 깨지므로,
      # 사용자가 겪기 전에 여기서 배포를 멈춘다.
      - run: npm run check:precache
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

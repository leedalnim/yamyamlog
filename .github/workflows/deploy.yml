name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.stamp.outputs.js }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 빌드에 필요한 파일이 git에 실제로 올라와 있는지 먼저 확인한다.
      # (.gitignore가 스크립트를 삼켜 배포가 실패한 적이 있다)
      - run: git ls-files --error-unmatch scripts/check-precache.mjs
      - run: git ls-files --error-unmatch scripts/check-contrast.mjs
      - run: npm ci
      - run: npm run build
      # 빌드가 참조하는 파일이 전부 프리캐시에 들어갔는지 확인한다.
      # 하나라도 빠지면 다음 배포 때 그 파일이 404가 되어 이미지가 깨지므로,
      # 사용자가 겪기 전에 여기서 배포를 멈춘다.
      # 동기화 병합 규칙(지운 게 되살아나지 않는지 등) 검증
      - run: npm test
      - run: npm run check:precache
      # 글자가 배경에 묻히는 곳이 없는지 실제로 그려서 재본다.
      # 다크 모드에서 검은 글씨가 검은 카드 위에 올라간 적이 있는데,
      # 눈으로 훑어서는 이런 걸 놓친다.
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run check:contrast
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # 이번 빌드의 대표 파일 이름(해시 포함). 배포 뒤 실제 사이트가 이걸
      # 내주는지 확인하는 데 쓴다.
      - id: stamp
        run: echo "js=$(grep -o 'assets/index-[^\"]*\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 설정을 'GitHub Actions' 로 바꿨다(2026-10-27). 예전 '브랜치에서 배포'
      # 시절에는 push 마다 GitHub 기본 배포(빌드 안 된 원본)가 같이 돌아 사이트를
      # 덮어 하얀 화면이 됐다. 그래서 75초 늦추고, 덮이면 다시 배포했는데 이제
      # 기본 배포가 없으니 필요 없다.
      - id: deployment
        uses: actions/deploy-pages@v4
      # 재발 방지: '배포 성공' 표시만 믿지 않고 실제 사이트를 열어 본다.
      # 3분 동안 이번 빌드가 안 보이면 실패로 남긴다.
      - name: 실제 사이트 확인
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          JS: ${{ needs.build.outputs.js }}
        run: |
          for i in $(seq 1 18); do
            # 캐시를 피하려고 매번 다른 주소로 연다
            if curl -fsSL "${URL}?check=$(date +%s%N)" | grep -q "$JS"; then
              echo "확인: 사이트가 이번 빌드($JS)를 내준다"; exit 0
            fi
            sleep 10
          done
          echo "::error::사이트가 이번 빌드($JS)를 내주지 않는다"
          exit 1

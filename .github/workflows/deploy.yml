name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 빌드에 필요한 파일이 git에 실제로 올라와 있는지 먼저 확인한다.
      # (.gitignore가 스크립트를 삼켜 배포가 실패한 적이 있다)
      - run: git ls-files --error-unmatch scripts/check-precache.mjs
      - run: git ls-files --error-unmatch scripts/check-contrast.mjs
      - run: npm ci
      - run: npm run build
      # 빌드가 참조하는 파일이 전부 프리캐시에 들어갔는지 확인한다.
      # 하나라도 빠지면 다음 배포 때 그 파일이 404가 되어 이미지가 깨지므로,
      # 사용자가 겪기 전에 여기서 배포를 멈춘다.
      # 동기화 병합 규칙(지운 게 되살아나지 않는지 등) 검증
      - run: npm test
      - run: npm run check:precache
      # 글자가 배경에 묻히는 곳이 없는지 실제로 그려서 재본다.
      # 다크 모드에서 검은 글씨가 검은 카드 위에 올라간 적이 있는데,
      # 눈으로 훑어서는 이런 걸 놓친다.
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run check:contrast
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 설정이 '브랜치에서 배포'라 push 마다 GitHub 기본 배포(Jekyll,
      # 빌드 안 된 원본)도 같이 돈다. 나중에 끝난 쪽이 사이트를 덮어쓰는데,
      # 2026-10-21 05:52 에 둘이 같은 초에 끝나 원본이 이겨 폰이 옛 버전에
      # 멈췄다. 기본 배포는 push 뒤 1분 30초 안에 끝나므로, 우리 배포를
      # 조금 늦춰 늘 마지막에 덮어쓰게 한다.
      # (Settings → Pages → Source 를 'GitHub Actions' 로 바꾸면 필요 없다)
      - if: github.event_name == 'push'
        run: sleep 75
      - id: deployment
        uses: actions/deploy-pages@v4

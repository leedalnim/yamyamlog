name: Check image search

# '이름으로 사진 고르기' 점검용 — 손으로만 돌린다.
# 다음(Daum) 이미지 검색에 제품 이름을 넣었을 때 어떤 사진들이 나오는지
# 앞쪽 8장을 한 장으로 모아 로그에 남긴다(base64). 열쇠는 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      q:
        description: 검색어 (제품 이름)
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 검색하고 사진 모으기
        env:
          Q: ${{ inputs.q }}
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null 2>&1 || true
          mkdir -p img
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['Q']))")
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          curl -sL -m 20 -A "$UA" -H 'Accept-Language: ko-KR,ko;q=0.9' -w '\n__STATUS__ %{http_code}\n' \
            "https://m.search.daum.net/search?w=img&q=$enc" -o page.html || true
          echo "페이지 크기: $(wc -c < page.html)"
          # 사진 주소 (썸네일 서버) — 중복 없이 앞에서부터
          grep -oE 'https?:(\\?/){2}search[0-9]\.kakaocdn\.net[^"&\\ ]+' page.html | sed 's#\\/#/#g' | awk '!s[$0]++' | head -12 > urls.txt || true
          echo "찾은 사진 주소: $(wc -l < urls.txt)"
          head -12 urls.txt
          # 사진 옆 제목(있으면)
          grep -oE '"(title|tit|alt)":"[^"]{4,80}"' page.html | head -12 || true
          i=0
          while read -r u; do
            i=$((i+1)); curl -sL -m 15 "$u" -o "img/$i.jpg" || true
          done < urls.txt
          ls -la img
          if ls img/*.jpg >/dev/null 2>&1; then
            montage img/*.jpg -tile 4x -geometry 180x180+6+6 -background white sheet.jpg
            convert sheet.jpg -quality 70 sheet.jpg
            echo "__SHEET_BEGIN__"; base64 -w 2000 sheet.jpg; echo "__SHEET_END__"
          else
            echo "사진을 못 받았다. 페이지 앞부분:"; head -c 1500 page.html
          fi

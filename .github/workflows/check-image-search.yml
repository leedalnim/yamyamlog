name: Check image search

# '이름으로 사진 고르기' 점검용 — 손으로만 돌린다.
# 다음(Daum) 이미지 검색에 제품 이름을 넣었을 때 어떤 사진들이 나오는지
# 앞쪽 8장을 한 장으로 모아 로그에 남긴다(base64). 열쇠는 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      q:
        description: 검색어 (제품 이름)
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 검색하고 사진 모으기
        env:
          Q: ${{ inputs.q }}
        run: |
          pip install -q pillow > /dev/null 2>&1
          mkdir -p img
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['Q']))")
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          curl -sL -m 20 -A "$UA" -H 'Accept-Language: ko-KR,ko;q=0.9' \
            "https://m.search.daum.net/search?w=img&q=$enc" -o page.html || true
          echo "페이지 크기: $(wc -c < page.html)"
          # 같은 사진이 크기별로 여러 번 나오므로 사진 id 로 한 번만, 정사각 썸네일로
          grep -oE 'https?:(\\?/){2}search[0-9]\.kakaocdn\.net/argon/[^"&\\ ]+' page.html | sed 's#\\/#/#g' \
            | sed -E 's#(argon/)[^/]+/#\1320x320_85_c/#' | awk -F/ '!s[$NF]++' | head -12 > urls.txt || true
          echo "서로 다른 사진: $(wc -l < urls.txt)"
          i=0
          while read -r u; do
            i=$((i+1)); curl -sL -m 15 "$u" -o "img/$(printf %02d $i).jpg" || true
          done < urls.txt
          python3 - <<'PY'
          import glob, base64
          from PIL import Image
          files = sorted(glob.glob('img/*.jpg'))
          W, P, cols = 180, 8, 4
          rows = (len(files) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * (W + P) + P, rows * (W + P) + P), 'white')
          for k, f in enumerate(files):
              try:
                  im = Image.open(f).convert('RGB')
              except Exception:
                  continue
              im.thumbnail((W, W))
              x = P + (k % cols) * (W + P) + (W - im.width) // 2
              y = P + (k // cols) * (W + P) + (W - im.height) // 2
              sheet.paste(im, (x, y))
          sheet.save('sheet.jpg', quality=70)
          b = base64.b64encode(open('sheet.jpg', 'rb').read()).decode()
          print('__SHEET_BEGIN__')
          for i in range(0, len(b), 2000):
              print(b[i:i + 2000])
          print('__SHEET_END__')
          PY
